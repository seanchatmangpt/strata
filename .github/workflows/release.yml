name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Release verification ladder
        run: |
          cargo test --workspace
          (cd stratus && mix deps.get && mix test)
          just test-wasm
          cargo clippy --workspace --all-targets -- -D warnings

  wasm-artifact:
    runs-on: ubuntu-latest
    needs: release-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build temprun wasm release
        run: just test-wasm
      - name: Attach wasm artifact
        uses: softprops/action-gh-release@v2
        with:
          files: target/wasm32-unknown-unknown/release/*.wasm
