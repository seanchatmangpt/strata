[package]
name = "strata-protocol"
version = "26.10.10"
edition = "2021"

[dependencies]
# `query` verb (bin/strata.rs) only: ontology graph load (oxrdfio, the same
# parser family oxigraph re-exports as oxigraph::io) + SPARQL evaluation.
# crates.io `sparql` 0.0.0 is an empty no_std facade (no engine) and cannot
# execute queries; `oxigraph` is the executable engine. Pinned =0.5.9: the
# last line pairing with spareval 0.2.6 (sha1 ^0.10) — spareval 0.2.7 (via
# oxigraph 0.5.10+) widened its sha1 req to <0.12 but its source only builds
# against sha1 0.11, which collides with this crate's `sha1 = "0.10"` lib dep.
oxigraph = "=0.5.9"
oxrdfio = "0.2"
blake3 = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
flate2 = "1"
sha1 = "0.10"
ml-dsa = "0.1.1"

[dev-dependencies]
temprun = { path = "../temprun" }

[[test]]
name = "n16_zero_recursion"
path = "tests/nato/n16_zero_recursion.rs"

