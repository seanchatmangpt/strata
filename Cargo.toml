[workspace]
resolver = "2"
members = ["strata_protocol", "temprun", "temprun/pn_kernel"]

[package]
name = "strata"
version = "26.10.11"
edition = "2021"
publish = false

[dev-dependencies]
strata-protocol = { path = "strata_protocol" }
temprun = { path = "temprun" }

[[test]]
name = "adversarial_court"
path = "tests/adversarial_court.rs"

[[test]]
name = "integration_frame_flow"
path = "tests/integration_frame_flow.rs"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
# Mirrors temprun/pn_kernel's standalone profile (ignored for workspace
# members); keeps the wasm kernel artifact at its 224-byte ABI size.
codegen-units = 1
strip = true
